<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>나의 일정</title>
  <meta name="description" content="할일 기간 관리와 요일별 루틴 체크를 위한 개인 일정 앱" />
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1f2320" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="나의 일정" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="today-label" id="todayLabel"></p>
      <h1 id="pageTitle">할일</h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="설정">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <!-- 할일 -->
    <section id="tasksView" class="view">
      <div class="chips" id="taskFilters" role="tablist">
        <button data-filter="all">전체</button>
        <button data-filter="today">오늘</button>
        <button data-filter="week">이번주</button>
        <button data-filter="nextweek">다음주</button>
        <button data-filter="month">이번달</button>
        <button data-filter="nextmonth">다음달</button>
      </div>
      <div class="subbar">
        <span id="taskRange" class="muted"></span>
        <label class="switch"><input type="checkbox" id="showDone" /> 완료 보기</label>
      </div>
      <div id="taskList" class="list"></div>
    </section>

    <!-- 루틴 -->
    <section id="routinesView" class="view" hidden>
      <div class="segmented" id="routineViewSeg">
        <button data-view="day">하루 체크</button>
        <button data-view="manage">루틴 관리</button>
      </div>

      <div id="routineDay">
        <div class="weekbar">
          <button class="icon-btn sm" id="prevWeek" aria-label="이전 주">‹</button>
          <div class="weekstrip" id="weekStrip"></div>
          <button class="icon-btn sm" id="nextWeek" aria-label="다음 주">›</button>
        </div>
        <div class="subbar">
          <span id="dayProgress" class="muted"></span>
          <div class="mini-seg" id="routineSortSeg">
            <button data-sort="group">그룹별</button>
            <button data-sort="time">시간순</button>
          </div>
        </div>
        <div class="progress"><div id="dayProgressBar"></div></div>
        <div id="routineDayList" class="list"></div>
      </div>

      <div id="routineManage" hidden>
        <div id="routineManageList" class="list"></div>
      </div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="추가">
    <svg viewBox="0 0 24 24" width="26" height="26" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar">
    <button data-tab="tasks">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M7 14h6"/></svg>
      <span>할일</span>
    </button>
    <button data-tab="routines">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v4h-4"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
      <span>루틴</span>
    </button>
  </nav>

  <!-- 할일 폼 -->
  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <h2 id="taskFormTitle">할일 추가</h2>
      <label>제목<input name="title" required maxlength="80" placeholder="무엇을 할까요?" /></label>
      <div class="row">
        <label>시작일<input type="date" name="start" required /></label>
        <label>종료일<input type="date" name="end" required /></label>
      </div>
      <div class="quick-range">
        <button type="button" data-len="1">하루</button>
        <button type="button" data-len="3">3일</button>
        <button type="button" data-len="7">1주</button>
        <button type="button" data-len="14">2주</button>
        <button type="button" data-len="30">한 달</button>
      </div>
      <fieldset>
        <legend>색상</legend>
        <div class="colors" id="taskColors"></div>
      </fieldset>
      <label>메모<textarea name="memo" rows="3" maxlength="500" placeholder="선택 사항"></textarea></label>
      <p class="form-error" id="taskError"></p>
      <div class="actions">
        <button type="button" class="btn danger" id="taskDelete">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 루틴 폼 -->
  <dialog id="routineDialog">
    <form method="dialog" id="routineForm">
      <h2 id="routineFormTitle">루틴 추가</h2>
      <label>이름<input name="title" required maxlength="60" placeholder="예: 물 한 잔 마시기" /></label>
      <div class="row">
        <label>시간<input type="time" name="time" /></label>
        <label>그룹<input name="group" list="groupList" maxlength="30" placeholder="예: 아침" /></label>
      </div>
      <datalist id="groupList"></datalist>
      <fieldset>
        <legend>반복 요일</legend>
        <div class="days" id="routineDays"></div>
        <div class="quick-range">
          <button type="button" data-days="0,1,2,3,4,5,6">매일</button>
          <button type="button" data-days="1,2,3,4,5">평일</button>
          <button type="button" data-days="0,6">주말</button>
        </div>
      </fieldset>
      <p class="form-error" id="routineError"></p>
      <div class="actions">
        <button type="button" class="btn danger" id="routineDelete">삭제</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-close>취소</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 설정 -->
  <dialog id="settingsDialog">
    <div class="settings">
      <h2>설정</h2>
      <p class="muted small">데이터는 이 기기의 브라우저에만 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 백업해 두세요.</p>
      <label>화면 테마
        <select id="themeSelect">
          <option value="auto">기기 설정 따르기</option>
          <option value="light">밝게 (종이색)</option>
          <option value="dark">어둡게 (숲색)</option>
        </select>
      </label>
      <button class="btn" id="exportBtn">백업 파일 저장 (.json)</button>
      <label class="btn file-btn">백업 파일 불러오기<input type="file" id="importInput" accept="application/json,.json" hidden /></label>
      <button class="btn" id="installBtn" hidden>홈 화면에 설치</button>
      <button class="btn danger" id="resetBtn">모든 데이터 삭제</button>
      <div class="actions"><span class="spacer"></span><button class="btn ghost" data-close>닫기</button></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
